<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pricing Logic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Pricing Logic</h5>
                    </div>
                    <div class="card-body">
                        <!-- Metode Penetapan Harga -->
                        <div class="form-group">
                            <label>Metode Penetapan Harga</label>
                            <div class="row">
                                <div class="col-6">
                                    <div class="custom-control custom-radio">
                                        <input type="radio" id="pricing_manual" name="pricing_type" value="manual" class="custom-control-input" checked>
                                        <label class="custom-control-label" for="pricing_manual">Manual</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="custom-control custom-radio">
                                        <input type="radio" id="pricing_margin" name="pricing_type" value="margin" class="custom-control-input">
                                        <label class="custom-control-label" for="pricing_margin">Margin</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Harga Modal -->
                        <div class="form-group">
                            <label>Harga Modal</label>
                            <input type="text" class="form-control" id="harga_modal" placeholder="100000">
                        </div>

                        <!-- Margin Input -->
                        <div class="form-group" id="margin_input" style="display: none;">
                            <label>Margin Keuntungan (%)</label>
                            <input type="number" class="form-control" id="margin_percentage" min="0" step="0.01" placeholder="10">
                        </div>

                        <!-- Harga Jual -->
                        <div class="form-group">
                            <label>Harga Jual</label>
                            <input type="text" class="form-control" id="harga_jual" placeholder="Akan terisi otomatis jika margin">
                            <small class="form-text text-muted" id="harga_jual_note">Manual input</small>
                        </div>

                        <!-- Debug Info -->
                        <div class="alert alert-info">
                            <h6>Debug Info:</h6>
                            <div id="debug_info">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const pricingManual = document.getElementById('pricing_manual');
            const pricingMargin = document.getElementById('pricing_margin');
            const marginInput = document.getElementById('margin_input');
            const hargaJualInput = document.getElementById('harga_jual');
            const hargaModalInput = document.getElementById('harga_modal');
            const marginPercentageInput = document.getElementById('margin_percentage');
            const hargaJualNote = document.getElementById('harga_jual_note');
            const debugInfo = document.getElementById('debug_info');

            function updateDebug(message) {
                debugInfo.innerHTML = message + '<br>' + debugInfo.innerHTML;
            }

            // Function to toggle pricing mode
            function togglePricingMode() {
                updateDebug('togglePricingMode called, margin checked: ' + pricingMargin.checked);
                
                if (pricingMargin.checked) {
                    // Margin mode
                    marginInput.style.display = 'block';
                    hargaJualInput.disabled = true;
                    hargaJualInput.readOnly = true;
                    hargaJualInput.style.backgroundColor = '#f8f9fa';
                    hargaJualInput.style.cursor = 'not-allowed';
                    hargaJualNote.innerHTML = 'Harga jual akan dihitung otomatis berdasarkan margin';
                    calculateMarginPrice();
                } else {
                    // Manual mode
                    marginInput.style.display = 'none';
                    hargaJualInput.disabled = false;
                    hargaJualInput.readOnly = false;
                    hargaJualInput.style.backgroundColor = '';
                    hargaJualInput.style.cursor = '';
                    hargaJualNote.innerHTML = 'Manual input';
                    hargaJualInput.value = '';
                }
            }

            // Function to calculate price based on margin
            function calculateMarginPrice() {
                updateDebug('calculateMarginPrice called');
                
                if (pricingMargin.checked) {
                    const hargaModalStr = hargaModalInput.value.replace(/[^\d]/g, '');
                    const hargaModal = parseFloat(hargaModalStr) || 0;
                    const margin = parseFloat(marginPercentageInput.value) || 0;
                    
                    updateDebug('Calculation: hargaModal=' + hargaModal + ', margin=' + margin);
                    
                    if (hargaModal > 0 && margin >= 0) {
                        const keuntungan = hargaModal * (margin / 100);
                        const hargaJual = hargaModal + keuntungan;
                        
                        updateDebug('Result: keuntungan=' + keuntungan + ', hargaJual=' + hargaJual);
                        
                        hargaJualInput.value = formatRupiah(hargaJual);
                    } else if (hargaModal > 0) {
                        hargaJualInput.value = formatRupiah(hargaModal);
                    } else {
                        hargaJualInput.value = '';
                    }
                }
            }

            function formatRupiah(number) {
                return new Intl.NumberFormat('id-ID').format(Math.round(number));
            }

            // Event listeners
            pricingManual.addEventListener('change', function() {
                updateDebug('Manual mode selected');
                togglePricingMode();
            });
            
            pricingMargin.addEventListener('change', function() {
                updateDebug('Margin mode selected');
                togglePricingMode();
            });
            
            hargaModalInput.addEventListener('input', function() {
                updateDebug('Harga modal changed: ' + this.value);
                
                let value = this.value.replace(/[^\d]/g, '');
                if (value) {
                    this.value = formatRupiah(parseFloat(value));
                }
                
                if (pricingMargin.checked) {
                    calculateMarginPrice();
                }
            });
            
            marginPercentageInput.addEventListener('input', function() {
                updateDebug('Margin percentage changed: ' + this.value);
                
                if (pricingMargin.checked) {
                    calculateMarginPrice();
                }
            });

            // Initialize
            updateDebug('Initializing...');
            togglePricingMode();
        });
    </script>
</body>
</html>
